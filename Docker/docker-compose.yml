# PLUGIN.PTP — PTP v1 + v2 + gPTP listener, one container — one of the four holding NET_RAW.
#     COMPOSE_PROFILES=l2 docker compose -f 'PODS/POD.THICK/PLUGINS/PLUGIN.PTP/Docker/docker-compose.yml' up -d --build
# Normally started with the other plugins, by node role (see discovery):
#     COMPOSE_PROFILES=discovery,l2 docker compose -f 'PODS/POD.THICK/DISCOVERY.Engine/Docker/docker-compose.yml' up -d
# The image, the capability floor, the broker variables and the healthcheck are
# the base service in DISCOVERY.Engine/Docker/plugin-base.yml; this file says
# only what is THIS plugin's. No bind mounts, so no `bind:` sub-key to carry.

# ONE PROJECT WITH THE REST (`apk-audio`), so the plugins clump with the node.
name: apk-audio

# IN THE POD: the discovery engine's compose file must `include:` this one, and
# DockTor's K8/plugin-includes.sh fails when it does not (PLAN-3395.01).
x-apk-plugin: true

# THE SHARED PLUGIN VOLUMES (apk-audio-logs, mac-lookup-cache) are declared once,
# in the engine's plugin-volumes.yml — identical to their owners' declarations —
# and included here instead of copied (2026-10-30 audit).
include:
  - path: "../../../DISCOVERY.Engine/Docker/plugin-volumes.yml"

services:
  ptp:
    extends:
      file: "../../../DISCOVERY.Engine/Docker/plugin-base.yml"
      service: plugin-host
    container_name: Plugin-PTP
    # WHAT THIS IS, said by the container itself (PLAN-3409.01): DockTor reads
    # these with docker inspect, so its purpose and endpoint panes keep no list.
    labels:
      audio.apk.purpose: "PTP v1, v2 and gPTP listener"
      audio.apk.purpose.what: "apk-ptp on host networking with NET_RAW and NET_BIND_SERVICE, listening to PTP on 319/320 and gPTP at Layer 2, and publishing the clocks and grandmaster it hears."
      audio.apk.purpose.why: "Every AES67, Dante and AVB stream depends on a shared clock. This is how the bench sees who is grandmaster and which domain each device follows; it is the other of the two raw-capability containers."
      audio.apk.endpoint.1: "copy udp://127.0.0.1:319 PTP event socket"
      audio.apk.endpoint.2: "copy udp://127.0.0.1:320 PTP general socket"
    command: ["apk-ptp"]
    profiles: [l2]
    # A RAW CAPABILITY, FOR gPTP over raw Ethernet (AF_PACKET), and
    # PTPv1/v2 on UDP 319/320, below 1024. Without NET_BIND_SERVICE the agent
    # reports `partial` — it still hears gPTP, and every UDP clock is invisible.
    cap_add: [NET_RAW, NET_BIND_SERVICE]

