# PTP (IEEE 1588) clock configuration
# config.ini published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/ptp/config
[ptp]
enabled = true
# No domain key: the agent publishes every domain it hears, and
# `ptp-monitor --domain N` is the only filter; `domain` was read by no code
# and is removed (LOOSE-config).
# MQTT address this file is published to, RETAINED, as `<topic>/config` --
# and `<topic>/status`, `<topic>/host` beside it. The reader is
# apk-plugin-runner's `module_topic()` (DISCOVERY.Engine/SRC/RUNNER/src/lib.rs).
# Nothing in this crate reads it.
topic = APK.audio/System/Protocols/ptp

# NO topic_listen / topic_ignore / topic_publish HERE, and that is load-bearing:
# DataBus/ledger/bus-ledger.js reads those keys off the retained payload
# above and mount-db.js renders them as what this agent subscribes to.
#   This crate publishes to `APK.audio/System/Protocols/ptp/Agent/*` and
#   `/Device/*`, not to the `/pub` the removed key claimed.
# Declaring them made the shell state a falsehood. Add one back only when
# a named function in this crate loads it. See ../Cargo.toml, "The four
# topic keys, and who actually reads them".

# CADENCE (RP-14) — read by Settings::from_ini (src/agent.rs), whole seconds
# above zero; a missing or wrong key stops the agent with its name rather than
# being guessed.
# heartbeat_s: how often every live clock, the agent state and the reception
#   counters are said again. Nothing is retained, so this is the only time a
#   value exists on the bus; it is also every AgentCounters sample's intervalMs.
# first_flush_s: the first flush comes this soon after start (<= heartbeat_s),
#   so a launcher checking that discovery works waits less than a heartbeat.
# clock_timeout_s: a clock not heard for this long is dropped and said gone.
#   PTP Sync runs at 1-8/s, so a healthy clock is never silent this long.
heartbeat_s = 30
first_flush_s = 10
clock_timeout_s = 30

# PRESENCE (PLAN-3318.01) — read by apk-plugin-runner::presence::settings_from_config.
# One retained status document (lastOnline / lastOffline / lastDiscovered) per clock port at
# APK.audio/Discovery/ptp/{deviceId}. THE ONE RETAINED THING THIS AGENT HAS
# (beside this config), and deliberately: the Device tree is published QoS 0
# with retain clear and restated every 30 s, so it says nothing by simply not
# being restated -- presence is what says a clock has GONE. The agent sights every live clock on each
# 30 s flush (heartbeat_s) and says a clock gone when it misses clock_timeout_s;
# the clock below is the backstop, 3 × heartbeat_s.
presence_protocols = ptp
presence_inactive_after_s = 90

# DEVICE PANELS (PLAN-3413.01) — read by apk-plugin-runner::panels::expire_after_from_config.
# A device's panel at APK.audio/System/Gui/Panels/<key> is emptied when it has
# said nothing for this many seconds. Nothing here is retained and the agent
# restates every known device every 30 s, so 120 is four missed restates.
panels_expire_after_s = 120
